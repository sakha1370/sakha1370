name: Update WakaTime Rank Badges

on:
  schedule:
    - cron: "0 */6 * * *" # هر ۶ ساعت یک‌بار
  workflow_dispatch: # امکان اجرای دستی

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch ranks and generate badge JSONs
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: python scripts/update_wakatime_rank.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/
          git diff --staged --quiet || (git commit -m "chore: update WakaTime rank badges" && git push)
